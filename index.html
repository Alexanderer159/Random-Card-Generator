<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Random Card Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
  <script src="app.js"></script>
</head>
  <body class="bg-success">
<div class="d-flex flex-column justify-content-center align-items-center vh-100 shadow-lg border-0">
  <div class="card rounded-4 d-flex flex-column justify-content-between align-items-center fw-bold p-4 shadow-lg border-0">
<div class="text-start w-100 display-1" id="symbolHigh">?</div>
<div class="display-6 display-1 fw-bold" id="number">?</div>
<div class="text-end w-100 display-1" id="symbolLow">?</div>
  </div>
  <div>
    <p class="" id="result"></p>
  </div>
  <div>
    <button type="button" class="btn btn-secondary btn-lg my-5 shadow-lg border-0" onclick="getWholeCard()">Get my Card</button>
  </div>
</div>
    
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
